services:
  - type: web
    name: planter-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn planter_app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      # NOTE: No API keys are required for Demo mode.
      # Add GOOGLE_PLACES_API_KEY, GOOGLE_GEMINI_API_KEY, and optionally
      # REPLICATE_API_TOKEN here if you want Live mode on Render.
